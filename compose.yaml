# قاعدة بيانات التطوير المحلي فقط. لا يحتوي على خدمات التطبيق ولا يُستخدم للنشر.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE مطلوب في .env}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER مطلوب في .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD مطلوب في .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD مطلوب في .env}
      MYSQL_TEST_USER: ${MYSQL_TEST_USER:?MYSQL_TEST_USER مطلوب في .env}
      MYSQL_TEST_PASSWORD: ${MYSQL_TEST_PASSWORD:?MYSQL_TEST_PASSWORD مطلوب في .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
