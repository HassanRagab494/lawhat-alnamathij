# إعداد الإنتاج/التجربة لـ Coolify (Docker Compose build pack) — مستقل عن compose.yaml الخاص بالتطوير.
# المشروع: lawhat-alnamathij · الدومين المخطط: forms.flowmaxsa.cloud (يُربط بخدمة web فقط من واجهة Coolify).
# لا تحتوي هذه الملفات على أسرار؛ القيم المطلوبة تُضبط في متغيرات Coolify (انظر deploy/coolify/README.md).
#
# حدود الثقة (docs/trust-boundary.md):
#   الزائر ⇒ وكيل Coolify (Traefik) ⇒ web:3000 ⇒ [شبكة backend الداخلية] ⇒ api:4000 ⇒ mysql:3306
#   - لا يوجد `ports:` لأي خدمة: لا منفذ منشور على المضيف.
#   - api وmysql على شبكة backend الداخلية فقط (internal: true)؛ لا دومين ولا router لهما.
#   - web يصل إلى api عبر الاسم المستعار lawha-api-backend المعرّف على شبكة backend وحدها،
#     فيأتي اتصاله من BACKEND_SUBNET، وTRUST_PROXY في api = BACKEND_SUBNET فقط.
#   - clamav (فاحص الملفات) وbackup بلا منافذ ولا دومينات؛ clamav على default أيضًا لتحديث التواقيع فقط.
#   - نسخة api واحدة فقط: حدود المعدل في الذاكرة (لا تُضف replicas).
# التخزين الدائم الخاص بالمشروع: lawha-mysql-data (القاعدة)، lawha-uploads (الملفات)، lawha-backups (النسخ)،
# lawha-clamav-db (تواقيع الفاحص). لا تحذف أي volume عند إعادة النشر.

name: lawhat-alnamathij

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lawha
      MYSQL_USER: lawha
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?اضبط MYSQL_PASSWORD في Coolify}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?اضبط MYSQL_ROOT_PASSWORD في Coolify}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      # تخزين دائم خاص بهذا المشروع. حذف المورد مع «حذف الـ volumes» يمسح البيانات.
      - lawha-mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      # لا ينتظر جاهزية الفاحص: الرفع يُرفض برسالة واضحة حتى يجهز، ولا يُقبل ملف دون فحص.
      clamav:
        condition: service_started
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME:-لوحة النماذج}
      API_PORT: '4000'
      # كلمة MYSQL_PASSWORD تُستخدم داخل URL: استخدم أحرفًا وأرقامًا فقط، أو رمّزها (percent-encoding).
      DATABASE_URL: mysql://lawha:${MYSQL_PASSWORD}@mysql:3306/lawha
      WEB_ORIGIN: ${WEB_ORIGIN:?اضبط WEB_ORIGIN مثل https://forms.flowmaxsa.cloud}
      COOKIE_SECURE: 'true'
      # يثق بـ X-Forwarded-For من شبكة backend فقط (أي من web). لا تضع true أو شبكة عامة.
      TRUST_PROXY: ${BACKEND_SUBNET:-10.213.47.0/28}
      API_DOCS_ENABLED: 'false'
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-120}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      PUBLIC_SUBMIT_PER_IP_PER_MINUTE: ${PUBLIC_SUBMIT_PER_IP_PER_MINUTE:-10}
      PUBLIC_SUBMIT_PER_FORM_PER_MINUTE: ${PUBLIC_SUBMIT_PER_FORM_PER_MINUTE:-120}
      RESPONSES_RATE_LIMIT_PER_MINUTE: ${RESPONSES_RATE_LIMIT_PER_MINUTE:-120}
      RESPONSES_EXPORT_PER_MINUTE: ${RESPONSES_EXPORT_PER_MINUTE:-5}
      # رفع الملفات: تخزين في volume خاص، وفحص بـ clamd عبر الشبكة الداخلية فقط.
      UPLOAD_DIR: /data/uploads
      CLAMAV_HOST: lawha-clamav-backend
      CLAMAV_PORT: '3310'
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-60000}
      UPLOAD_SESSION_TTL_MINUTES: ${UPLOAD_SESSION_TTL_MINUTES:-240}
      UPLOAD_SESSION_MAX_MB: ${UPLOAD_SESSION_MAX_MB:-100}
      UPLOAD_STORAGE_MAX_GB: ${UPLOAD_STORAGE_MAX_GB:-20}
      PUBLIC_UPLOAD_PER_IP_PER_MINUTE: ${PUBLIC_UPLOAD_PER_IP_PER_MINUTE:-30}
      PUBLIC_UPLOAD_PER_FORM_PER_MINUTE: ${PUBLIC_UPLOAD_PER_FORM_PER_MINUTE:-300}
    volumes:
      - lawha-uploads:/data/uploads
    expose:
      - '4000'
    networks:
      backend:
        aliases:
          - lawha-api-backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # العنوان الداخلي للـ API على شبكة backend؛ يُثبت وقت البناء.
        API_ORIGIN: http://lawha-api-backend:4000
        APP_NAME: ${APP_NAME:-لوحة النماذج}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
    expose:
      - '3000'
    networks:
      # default: الشبكة التي يربط بها Coolify وكيله؛ backend: للوصول إلى api فقط.
      - default
      - backend

  clamav:
    build:
      context: .
      dockerfile: deploy/clamav/Dockerfile
    restart: unless-stopped
    # سقف موارد صريح حتى لا يضر المشاريع الأخرى على الخادم (التواقيع وحدها ~1.2GB في الذاكرة).
    mem_limit: ${CLAMAV_MEM_LIMIT:-2g}
    memswap_limit: ${CLAMAV_MEM_LIMIT:-2g}
    cpus: ${CLAMAV_CPUS:-1.0}
    volumes:
      - lawha-clamav-db:/var/lib/clamav
    expose:
      - '3310'
    networks:
      # default: اتصال خارجي لتحديث التواقيع (freshclam) فقط؛ backend: ليصل إليه api.
      default: {}
      backend:
        aliases:
          - lawha-clamav-backend

  backup:
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    restart: unless-stopped
    mem_limit: ${BACKUP_MEM_LIMIT:-512m}
    cpus: ${BACKUP_CPUS:-0.5}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: lawha
      BACKUP_DB_USER: lawha_backup
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?اضبط BACKUP_DB_PASSWORD (حساب القراءة lawha_backup)}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?اضبط BACKUP_ENCRYPTION_KEY واحفظ نسخة منه خارج الخادم}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      TZ: Asia/Riyadh
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /backups
    volumes:
      - lawha-uploads:/data/uploads:ro
      - lawha-backups:/backups
    networks:
      - backend

networks:
  default: {}
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-10.213.47.0/28}

volumes:
  lawha-mysql-data:
  lawha-uploads:
  lawha-backups:
  lawha-clamav-db:
